name: Task / feature
description: Something to build or change in Flick
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What should be done?
      description: Describe the task in simple words.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when…
      description: How do we know it is finished? A short checklist.
      placeholder: |
        - [ ] …
        - [ ] Tests added or updated
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Backend (Python), Frontend (React), Desktop (Electron), Docs / report, Design]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes, links, screenshots
