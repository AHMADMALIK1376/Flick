# Runs on every pull request and every push to main.
# A pull request can be merged only when both jobs are green.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python) tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Test
        run: python -m pytest -q

  desktop:
    name: Desktop app (Electron) type-check and tests
    # Flick is a Windows app, and some tests check Windows paths.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/electron
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/electron/package-lock.json
      - name: Install
        run: npm ci --ignore-scripts
      - name: Type-check
        run: npx tsc --noEmit -p .
      - name: Test
        run: npx vitest run
