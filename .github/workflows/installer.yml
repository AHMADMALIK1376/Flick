# Builds the Windows installer (Flick-Setup-<version>.exe).
#   - Run it by hand: Actions → "Windows installer" → Run workflow. The .exe is attached to the run.
#   - Push a tag like v1.0.0: the .exe is also published as a GitHub Release.
#   - Pull requests that change the installer build it too (to check it still works).
name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request: # only when the installer itself changes
    paths:
      - .github/workflows/installer.yml
      - backend/flick.spec
      - backend/run_flick.py
      - apps/electron/package.json
      - apps/electron/installer/**

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # 1. Backend → backend/dist/flick-backend/flick-backend.exe
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Bundle the Python backend
        working-directory: backend
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller flick.spec --noconfirm
      - name: Check the bundled backend starts
        working-directory: backend
        shell: pwsh
        run: |
          $env:FLICK_TOKEN = "ci"
          $env:FLICK_DATA_DIR = "$env:RUNNER_TEMP\flick-ci"
          $p = Start-Process -FilePath "dist\flick-backend\flick-backend.exe" -ArgumentList "--port","8765" -PassThru -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Seconds 2
            try { $ok = (Invoke-RestMethod http://127.0.0.1:8765/health -Headers @{ "X-Flick-Token" = "ci" }).ok } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "The bundled backend did not answer /health" }

      # 2. Screens → apps/ui/dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the screens
        working-directory: apps/ui
        run: |
          npm ci
          npm run build

      # 3. Desktop app + installer → apps/electron/dist/Flick-Setup-<version>.exe
      - name: Build the installer
        working-directory: apps/electron
        run: |
          npm ci
          npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: Flick-Setup
          path: apps/electron/dist/*.exe
          if-no-files-found: error

      - name: Publish a GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME (Get-ChildItem apps/electron/dist/*.exe).FullName --title "Flick $env:GITHUB_REF_NAME" --generate-notes
